name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Tests mit Abdeckung (Kernlogik mindestens 80 %)
        run: npm test
      - name: Build
        run: npm run build
      - name: Eingechecktes Build-Ergebnis ist aktuell
        run: git diff --exit-code dist/index.html
